<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Cuenta - Gestión de Laboratorios</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="alertBox" class="alert-box"></div>

    <div class="auth-wrapper">
        <div class="glass-panel auth-card">
            <div class="auth-header">
                <h1>Crear Cuenta</h1>
                <p>Regístrese para administrar laboratorios</p>
            </div>
            
            <form id="registroForm">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" class="input-control" placeholder="Nombre de usuario" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="input-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>
                
                <div class="input-group">
                    <label for="rol">Rol del Usuario</label>
                    <select id="rol" class="select-control" required>
                        <option value="ADMIN">ADMINISTRADOR</option>
                        <option value="PERSONAL">PERSONAL DE LAB</option>
                        <option value="INVESTIGADOR">INVESTIGADOR</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary" style="margin-top: 10px;">Crear Cuenta</button>
            </form>
            
            <div class="auth-footer">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        checkSession(false);

        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const r = document.getElementById('rol').value;
            
            if (u && p && r) {
                registrarUsuario(u, p, r);
            }
        });
    </script>
</body>
</html>
