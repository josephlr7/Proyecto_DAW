<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestión de Laboratorios</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="alertBox" class="alert-box"></div>

    <div class="auth-wrapper">
        <div class="glass-panel auth-card">
            <div class="auth-header">
                <h1>G-LAB UNT</h1>
                <p>Sistema de Gestión de Laboratorios de Investigación</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" class="input-control" placeholder="Ingrese su usuario" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="input-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary" style="margin-top: 10px;">Iniciar Sesión</button>
            </form>
            
            <div class="auth-footer">
                ¿No tienes una cuenta? <a href="registro.html">Registrarse aquí</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Check if user is already logged in, redirect to index
        checkSession(false);

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            
            if (u && p) {
                login(u, p);
            }
        });
    </script>
</body>
</html>
