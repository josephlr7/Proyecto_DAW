info:
  name: Crear Cliente
  type: http
  seq: 3

http:
  method: post
  url: http://localhost:8080/api/v1/clientes
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombres": "Juan",
        "apellidos": "Pérez Ramos",
        "numeroDocumento": "12345678",
        "email": "juan@gmail.com",
        "telefono": "987654321",
        "direccion": "Av. Lima 123"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
