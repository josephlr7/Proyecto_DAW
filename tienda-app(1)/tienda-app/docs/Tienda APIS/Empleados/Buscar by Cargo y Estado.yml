info:
  name: Buscar by Cargo y Estado
  type: http
  seq: 10

http:
  method: get
  url: http://localhost:8080/api/v1/empleados/consulta?cargo=administrador&activo=true
  params:
    - name: cargo
      value: administrador
      type: query
    - name: activo
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
