info:
  name: Filtrar por rango de precios
  type: http
  seq: 14

http:
  method: get
  url: http://localhost:8080/api/v1/productos/consulta?precioMinimo=1500&precioMaximo=3000
  params:
    - name: precioMinimo
      value: "1500"
      type: query
    - name: precioMaximo
      value: "3000"
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
