info:
  name: Ordenar por Stock
  type: http
  seq: 17

http:
  method: get
  url: http://localhost:8080/api/v1/productos/consulta?orden=stock&direccion=desc
  params:
    - name: orden
      value: stock
      type: query
    - name: direccion
      value: desc
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
