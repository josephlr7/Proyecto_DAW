info:
  name: Filtro y Ordenamiento
  type: http
  seq: 18

http:
  method: get
  url: http://localhost:8080/api/v1/productos/consulta?nombre=ipad&marca=Apple&categoria=Tablets&activo=true&precioMinimo=1000&precioMaximo=3000&orden=precio&direccion=asc
  params:
    - name: nombre
      value: ipad
      type: query
    - name: marca
      value: Apple
      type: query
    - name: categoria
      value: Tablets
      type: query
    - name: activo
      value: "true"
      type: query
    - name: precioMinimo
      value: "1000"
      type: query
    - name: precioMaximo
      value: "3000"
      type: query
    - name: orden
      value: precio
      type: query
    - name: direccion
      value: asc
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
